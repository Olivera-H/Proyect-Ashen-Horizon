from PIL import Image
import os

src = "/mnt/data/a_pixel_art_retro_16_bit_style_circular_emblem.png"
im = Image.open(src).convert("RGB")

# Reconstruir cuantizando a 128x128 con colores limitados
small = im.resize((128, 128), Image.Resampling.BOX).quantize(colors=24, method=Image.Quantize.MEDIANCUT)
rgb = small.convert("RGB")

lines = [
    '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">',
    '  <title>Ashen Horizon - icon</title>',
    '  <rect width="128" height="128" fill="#000000"/>'  # Añadimos el fondo negro base
]

# Ejecutar la compresión de líneas horizontales (RLE)
for y in range(128):
    x = 0
    while x < 128:
        c = rgb.getpixel((x, y))
        j = x + 1
        while j < 128 and rgb.getpixel((j, y)) == c:
            j += 1
        # Omitimos el color negro para ahorrar espacio, ya que el fondo ya es negro
        if c != (0, 0, 0):
            lines.append(f'  <rect x="{x}" y="{y}" width="{j-x}" height="1" fill="#{c[0]:02x}{c[1]:02x}{c[2]:02x}"/>')
        x = j

lines.append('</svg>')

out = "/mnt/data/icon.svg"
with open(out, "w") as f:
    f.write("\n".join(lines))

print(out, os.path.getsize(out), len(lines))
